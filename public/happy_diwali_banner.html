<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3c76a;--gold2:#c9972b;--text:#fff1d6;--u:clamp(70px,20vw,150px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;color:var(--text);
background:radial-gradient(ellipse at 50% 0%,rgba(255,122,61,.35) 0,transparent 45%),radial-gradient(ellipse at 50% 55%,#4a1a8f 0,#2a0e66 45%,#12063a 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:16vh;pointer-events:none}
.g{background:linear-gradient(#ffe9a8,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:"Great Vibes",cursive;padding:.25em .5em;filter:drop-shadow(0 0 14px rgba(255,170,60,.45))}
.hp{font-size:clamp(2rem,7vw,3.6rem);opacity:0;animation:rise 1.4s .5s forwards}
.dw{font-size:clamp(4.6rem,20vw,10rem);line-height:1.2;margin-top:-.2em;opacity:0;animation:rise 1.6s 1.2s forwards}
.ta{margin:.8rem 1rem 0;font-family:"Noto Serif Tamil",serif;font-size:clamp(1rem,3.6vw,1.6rem);color:var(--gold);opacity:0;animation:rise 1.6s 2.4s forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
/* lanterns */
.l{position:absolute;top:0;width:0;transform-origin:50% 0;animation:sw 4s ease-in-out infinite alternate}
.l:before{content:"";position:absolute;left:0;top:0;width:1px;height:var(--len);background:rgba(255,200,120,.55)}
.l i{position:absolute;left:calc(var(--w)/-2);top:var(--len);width:var(--w);height:calc(var(--w)*1.55);border:2px solid #c75a1a;border-radius:30% 30% 40% 40%/20% 20% 50% 50%;background:radial-gradient(circle at 50% 55%,#fff3b0,#ffb347 40%,#e8651a);box-shadow:0 0 28px 8px rgba(255,150,60,.5);animation:gl 2s ease-in-out infinite alternate}
.l i:before{content:"";position:absolute;left:20%;right:20%;top:-9px;height:8px;background:#c75a1a;border-radius:4px 4px 0 0}
@keyframes sw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes gl{from{filter:brightness(.9)}to{filter:brightness(1.2)}}
/* stage */
.stage{position:absolute;left:0;right:0;bottom:3vh;display:flex;justify-content:center;align-items:flex-end;gap:2vw;opacity:0;animation:rise 1.6s 3s forwards}
.rip{position:absolute;left:50%;bottom:-2vh;border:2px solid rgba(255,90,150,.55);border-radius:50%;transform:translateX(-50%);animation:rp 3s ease-in-out infinite alternate;box-shadow:0 0 30px rgba(255,60,140,.35)}
.r1{width:90vw;max-width:1000px;height:12vh}.r2{width:60vw;max-width:680px;height:8vh;animation-delay:.6s}
@keyframes rp{from{transform:translateX(-50%) scale(.97);opacity:.6}to{transform:translateX(-50%) scale(1.03);opacity:1}}
.d{position:relative;z-index:2;width:calc(var(--u)*var(--s));height:calc(var(--u)*.3*var(--s))}
.bowl{position:absolute;inset:0;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#ffb04a,#e0701a 55%,#a8420c);box-shadow:0 0 40px 8px rgba(255,140,60,.35)}
.bowl:before{content:"";position:absolute;left:0;right:0;top:-12%;height:26%;border-radius:50%;background:radial-gradient(ellipse,#ffd89a,#f0952f)}
.fl{position:absolute;left:50%;bottom:92%;width:calc(var(--u)*.1*var(--s));height:calc(var(--u)*.3*var(--s));margin-left:calc(var(--u)*-.05*var(--s));background:radial-gradient(ellipse at 50% 72%,#fff7c2,#ffbf3a 50%,#ff6a00);border-radius:50% 50% 50% 50%/72% 72% 28% 28%;transform-origin:50% 100%;animation:fk .45s infinite alternate;box-shadow:0 0 22px 8px rgba(255,170,40,.55)}
@keyframes fk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.lo{position:absolute;bottom:2vh;width:clamp(90px,20vw,220px);z-index:1;opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ls"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7fb8"/><stop offset="1" stop-color="#a3205f"/></linearGradient>
<symbol id="lotus" viewBox="-100 -100 200 110"><g fill="url(#pk)" opacity=".92">
<ellipse cx="0" cy="-45" rx="14" ry="45" transform="rotate(-70)"/><ellipse cx="0" cy="-45" rx="14" ry="45" transform="rotate(70)"/>
<ellipse cx="0" cy="-45" rx="14" ry="45" transform="rotate(-38)"/><ellipse cx="0" cy="-45" rx="14" ry="45" transform="rotate(38)"/>
<ellipse cx="0" cy="-50" rx="15" ry="50"/></g></symbol></defs></svg>
<svg class="lo" style="left:1vw"><use href="#lotus" width="100%" height="100%"/></svg>
<svg class="lo" style="right:1vw"><use href="#lotus" width="100%" height="100%"/></svg>
<div class="wrap">
  <div class="g hp">Happy</div>
  <div class="g dw">Diwali</div>
</div>
<div class="stage">
  <div class="rip r1"></div><div class="rip r2"></div>
  <div class="d" style="--s:.55"><i class="bowl"></i><i class="fl"></i></div>
  <div class="d" style="--s:.85"><i class="bowl"></i><i class="fl" style="animation-delay:.15s"></i></div>
  <div class="d" style="--s:1"><i class="bowl"></i><i class="fl" style="animation-delay:.3s"></i></div>
  <div class="d" style="--s:.85"><i class="bowl"></i><i class="fl" style="animation-delay:.1s"></i></div>
  <div class="d" style="--s:.55"><i class="bowl"></i><i class="fl" style="animation-delay:.25s"></i></div>
</div>
<script>
// lanterns
[[5,90,30],[15,210,40],[30,60,28],[80,150,32],[89,70,30],[95,250,40]].forEach(([x,len,w],i)=>{
  const d=document.createElement('div');d.className='l';
  d.style.cssText=`left:${x}%;--len:${len}px;--w:${w}px;animation-delay:${-i*.7}s`;
  d.innerHTML='<i></i>';document.getElementById('ls').appendChild(d)});
// fireworks
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,P=[],R=[],S=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight;S=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.4+.4,p:Math.random()*6}))}
addEventListener('resize',size);size();
const hues=[40,45,20,330,300,280,50];
function launch(px){R.push({x:px??Math.random()*W*.84+W*.08,y:H*.85,ty:H*(.12+Math.random()*.3),h:hues[Math.random()*hues.length|0]})}
function burst(bx,by,h){const n=80;for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.1,s=Math.random()*3.5+1.2;P.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+Math.random()*25})}}
addEventListener('pointerdown',e=>launch(e.clientX));
setInterval(()=>launch(),650);
let t=0;
function loop(){
  t+=.03;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
  S.forEach(s=>{x.fillStyle=`rgba(255,220,150,${.35+.35*Math.sin(t*2+s.p)})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()});
  R=R.filter(r=>{r.y-=7;x.strokeStyle='#ffe9a8';x.lineWidth=2;x.beginPath();x.moveTo(r.x,r.y);x.lineTo(r.x,r.y+14);x.stroke();if(r.y<=r.ty){burst(r.x,r.y,r.h);return false}return true});
  x.lineWidth=1.6;
  P=P.filter(p=>{const px=p.x,py=p.y;p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.984;p.vy*=.992;p.l-=.011;
    x.strokeStyle=`hsla(${p.h},100%,65%,${Math.max(p.l,0)})`;x.beginPath();x.moveTo(px-p.vx*2,py-p.vy*2);x.lineTo(p.x,p.y);x.stroke();return p.l>0});
  requestAnimationFrame(loop)}
launch(W*.25);setTimeout(()=>launch(W*.75),300);setTimeout(()=>launch(W*.5),700);loop();
</script>
</body>
</html>
